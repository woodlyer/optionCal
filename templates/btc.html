<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC 比特币期权定价分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --primary: #f7931a;
            --primary-hover: #e08311;
            --primary-light: #fff7ed;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --sidebar-width: 240px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* 左侧固定导航栏 Navigation */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar-brand {
            padding: 20px 18px;
            font-size: 17px;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-menu {
            list-style: none;
            padding: 16px 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            color: #ffffff;
            background-color: var(--sidebar-hover);
        }

        .nav-link.active {
            color: #ffffff;
            background-color: var(--primary);
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logout-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            background-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .logout-link:hover {
            background-color: #ef4444;
            color: white;
        }

        /* 右侧主体内容 */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 24px;
            max-width: calc(100vw - var(--sidebar-width));
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-title h1 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f1f5f9;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 全局参数 */
        .global-params-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: #fff7ed;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px dashed #fdba74;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .global-params-bar label {
            font-size: 13px;
            font-weight: 600;
            color: #c2410c;
        }

        .global-params-bar input[type="number"] {
            padding: 6px 10px;
            border: 1px solid #fdba74;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            width: 120px;
            color: #9a3412;
        }

        /* 期权输入列表 */
        .option-inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            background-color: #f8fafc;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .option-row > div {
            flex: 1 1 120px;
            min-width: 120px;
        }

        .option-row > div.action-btn-col {
            flex: 0 0 auto;
            min-width: auto;
        }

        .option-row > div.delete-btn-col {
            flex: 0 0 auto;
            min-width: auto;
        }

        .option-row label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
            display: block;
        }

        .option-row input[type="date"],
        .option-row input[type="number"],
        .option-row select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background-color: #fff;
            font-weight: 500;
        }

        .option-row input:focus, .option-row select:focus {
            border-color: var(--primary);
        }

        .delete-option {
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fca5a5;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s;
            align-self: flex-end;
            margin-bottom: 2px;
        }

        .delete-option:hover {
            background-color: #ef4444;
            color: white;
        }

        /* 按钮组 */
        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        /* 图表容器 */
        .chart-card {
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }

        .chart-container {
            width: 100%;
            height: 520px;
            position: relative;
        }

        .chart-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            background-color: #fff;
            padding: 20px;
        }

        #exitFullscreenButton {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            z-index: 1001;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
            }
            .main-content {
                margin-left: 0;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 左侧固定导航栏 -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            📊 期权与金价分析平台
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="/" class="nav-link">
                    <span>📈</span>
                    <span>GLD 期权定价分析</span>
                </a>
            </li>
            <li>
                <a href="/btc" class="nav-link active">
                    <span>₿</span>
                    <span>BTC 期权定价分析</span>
                </a>
            </li>
            <li>
                <a href="/gold" class="nav-link">
                    <span>🪙</span>
                    <span>黄金/XAU 换算中心</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <a href="/logout" class="logout-link">
                <span>🚪</span>
                <span>退出系统登录</span>
            </a>
        </div>
    </aside>

    <!-- 主体区域 -->
    <main class="main-content">
        <div class="page-header" style="margin-bottom: 12px;">
            <div class="page-title">
                <h1>₿ 比特币 (BTC) 期权定价与估值模型</h1>
                <p>根据到期时间（包含北京时间16:00/Deribit交割点）推算 Black-Scholes 期权理论价格</p>
            </div>
        </div>

        <!-- 参数配置卡片 -->
        <div class="card">
            <div class="card-header">
                <div>
                    <span class="card-title">📝 BTC 期权合约组合参数设置</span>
                    <span style="font-size: 12px; color: #64748b;">设置到期日、行权价 ($50,000 - $160,000) 及波动率</span>
                </div>
            </div>

            <div class="global-params-bar">
                <label for="riskFreeRate">🔑 BTC 无风险利率 (r):</label>
                <input type="number" id="riskFreeRate" step="0.000001" value="0.052197" required>
                <span style="font-size: 12px; color: #ea580c;">(基于加密货币无风险折算利率)</span>
            </div>

            <div id="optionInputs" class="option-inputs">
                <!-- 动态创建期权输入行 -->
            </div>
        </div>

        <!-- 图表展示卡片 -->
        <div class="chart-card">
            <div class="card-header">
                <span class="card-title">📉 BTC 现货价格敏感度期权收益曲线 ($50k - $160k)</span>
                <div>
                    <button id="resetChart" class="btn-secondary" style="padding: 6px 12px; font-size: 12px;">重置缩放</button>
                    <button id="toggleFullscreen" class="btn-secondary" style="padding: 6px 12px; font-size: 12px; margin-left: 6px;">全屏图表</button>
                </div>
            </div>

            <div class="chart-container">
                <div id="priceChart" style="width: 100%; height: 100%;"></div>
                <button id="exitFullscreenButton">✕ 退出全屏</button>
            </div>
        </div>
    </main>

    <script>
        const optionInputsContainer = document.getElementById('optionInputs');
        const resetChartButton = document.getElementById('resetChart');
        const toggleFullscreenButton = document.getElementById('toggleFullscreen');
        const exitFullscreenButton = document.getElementById('exitFullscreenButton');
        const riskFreeRateInput = document.getElementById('riskFreeRate');
        const chartContainer = document.querySelector('.chart-container');

        const chartDom = document.getElementById('priceChart');
        let myChart = echarts.init(chartDom);

        let optionCounter = 0;

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function calculateCurves() {
            const options = [];
            document.querySelectorAll('.option-row').forEach(row => {
                const id = row.getAttribute('data-option-id');
                options.push({
                    expiryDate: document.getElementById(`expiryDate-${id}`).value,
                    strikePrice: parseFloat(document.getElementById(`strikePrice-${id}`).value),
                    volatility: parseFloat(document.getElementById(`volatility-${id}`).value),
                    calculationDate: document.getElementById(`calculationDate-${id}`).value,
                    optionType: document.getElementById(`optionType-${id}`).value
                });
            });

            const riskFreeRate = parseFloat(riskFreeRateInput.value);

            try {
                const response = await fetch('/calculate_btc_option_prices', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        options: options,
                        riskFreeRate: riskFreeRate
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                const option = {
                    toolbox: {
                        feature: {
                            saveAsImage: {}
                        }
                    },
                    tooltip: {
                        trigger: 'axis',
                        formatter: function(params) {
                            let res = '<b>BTC 现货价格: $' + params[0].value[0] + '</b><br/>';
                            params.forEach(item => {
                                res += item.marker + item.seriesName + ': <b>$' + item.value[1].toFixed(2) + '</b><br/>';
                            });
                            return res;
                        },
                        axisPointer: {
                            type: 'cross'
                        }
                    },
                    legend: {
                        top: 0
                    },
                    xAxis: {
                        type: 'value',
                        name: 'BTC 价格 ($)',
                        axisLabel: {
                            formatter: '${value}'
                        }
                    },
                    yAxis: {
                        type: 'value',
                        name: 'BTC 期权价格 ($)',
                        min: -5000,
                        axisLabel: {
                            formatter: '${value}'
                        }
                    },
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '10%',
                        containLabel: true
                    },
                    dataZoom: [
                        {
                            type: 'inside',
                            xAxisIndex: [0],
                            filterMode: 'none',
                            zoomOnMouseWheel: true,
                            moveOnMouseMove: true
                        },
                        {
                            type: 'inside',
                            yAxisIndex: [0],
                            filterMode: 'none',
                            zoomOnMouseWheel: true,
                            moveOnMouseMove: true
                        }
                    ],
                    series: data.datasets.map(d => ({
                        name: d.label,
                        type: d.type,
                        smooth: d.smooth,
                        data: d.data,
                        lineStyle: d.lineStyle
                    }))
                };

                myChart.setOption(option, true);

            } catch (error) {
                console.error('计算曲线时出错:', error);
                alert('计算 BTC 期权曲线时出错，请检查后重试。');
            }
        }

        function addOptionRow() {
            optionCounter++;
            const isFirst = (optionInputsContainer.children.length === 0);
            const optionRow = document.createElement('div');
            optionRow.classList.add('option-row');
            optionRow.setAttribute('data-option-id', optionCounter);

            const defaultExpiryDate = new Date('2026-08-29');
            const defaultCalcDate = new Date();

            let actionsHTML = '';
            if (isFirst) {
                actionsHTML = `
                    <div class="action-btn-col" style="display: flex; gap: 8px; align-items: flex-end;">
                        <button id="addOption" class="btn-success" style="height: 36px; white-space: nowrap;">＋ 添加 BTC 期权</button>
                        <button id="calculateCurves" class="btn-primary" style="height: 36px; white-space: nowrap;">⚡ 计算并绘制 BTC 曲线</button>
                    </div>
                `;
            } else {
                actionsHTML = `
                    <div class="delete-btn-col" style="display: flex; align-items: flex-end;">
                        <button class="delete-option" data-option-id="${optionCounter}" title="删除此期权">✕</button>
                    </div>
                `;
            }

            optionRow.innerHTML = `
                <div>
                    <label for="expiryDate-${optionCounter}">到期日</label>
                    <input type="date" id="expiryDate-${optionCounter}" value="${formatDate(defaultExpiryDate)}" required>
                </div>
                <div>
                    <label for="strikePrice-${optionCounter}">行权价 ($)</label>
                    <input type="number" id="strikePrice-${optionCounter}" step="1000" min="0" value="80000" required>
                </div>
                <div>
                    <label for="volatility-${optionCounter}">波动率 (%)</label>
                    <input type="number" id="volatility-${optionCounter}" step="0.01" min="0.000001" value="38.26" required>
                </div>
                <div>
                    <label for="optionType-${optionCounter}">期权类型</label>
                    <select id="optionType-${optionCounter}">
                        <option value="call">看涨 (Call)</option>
                        <option value="put">看跌 (Put)</option>
                    </select>
                </div>
                <div>
                    <label for="calculationDate-${optionCounter}">计算基准日</label>
                    <input type="date" id="calculationDate-${optionCounter}" value="${formatDate(defaultCalcDate)}" required>
                </div>
                ${actionsHTML}
            `;
            optionInputsContainer.appendChild(optionRow);

            if (isFirst) {
                document.getElementById('addOption').addEventListener('click', addOptionRow);
                document.getElementById('calculateCurves').addEventListener('click', calculateCurves);
            } else {
                optionRow.querySelector('.delete-option').addEventListener('click', function() {
                    optionRow.remove();
                    if (optionInputsContainer.children.length === 0) {
                        addOptionRow();
                    }
                });
            }
        }

        addOptionRow();

        resetChartButton.addEventListener('click', () => {
            calculateCurves();
        });

        function toggleFullscreen(isExit = false) {
            if (chartContainer.classList.contains('fullscreen') || isExit) {
                chartContainer.classList.remove('fullscreen');
                exitFullscreenButton.style.display = 'none';
                toggleFullscreenButton.textContent = '全屏图表';
            } else {
                chartContainer.classList.add('fullscreen');
                exitFullscreenButton.style.display = 'block';
                toggleFullscreenButton.textContent = '退出全屏';
            }
            myChart.resize();
        }

        toggleFullscreenButton.addEventListener('click', () => toggleFullscreen());
        exitFullscreenButton.addEventListener('click', () => toggleFullscreen(true));

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && chartContainer.classList.contains('fullscreen')) {
                toggleFullscreen(true);
            }
        });

        window.addEventListener('resize', function() {
            if (myChart) myChart.resize();
        });

        document.addEventListener('DOMContentLoaded', () => {
            calculateCurvesButton.click();
        });
    </script>
</body>
</html>
